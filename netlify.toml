[build]
  # Directory to publish (build output)
  publish = "dist"
  
  # Build command
  command = "npm run build"

[build.environment]
  # Node version for build
  NODE_VERSION = "18"

# Optional: Redirect rules can also be defined here instead of _redirects file
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200